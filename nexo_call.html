<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Nexo Calling</title>

<style>

body {
    margin: 0;
    padding: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h2 {
    margin: 15px;
}

#localVideo {
    width: 100%;
    height: 60vh;
    background: black;
    object-fit: cover;
}

#status {
    margin: 12px;
    font-size: 15px;
}

.controls {
    padding: 10px;
}

button {
    padding: 12px 14px;
    margin: 5px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
}

</style>

</head>

<body>

<h2>📞 Nexo Calling</h2>

<video
    id="localVideo"
    autoplay
    playsinline
    muted>
</video>

<div id="status">
Starting camera and microphone...
</div>

<div class="controls">

<button
    id="muteButton"
    onclick="toggleMute()">
🎤 Mute
</button>

<button
    id="cameraButton"
    onclick="toggleCamera()">
📹 Camera
</button>

<button
    onclick="switchCamera()">
🔄 Switch Camera
</button>

</div>

<script>

let stream = null;

let videoTrack = null;

let audioTrack = null;

let currentCamera = "user";


// ======================================
// START CAMERA AND MICROPHONE
// ======================================

async function startCall() {

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: currentCamera
                },

                audio: true

            });


        document
            .getElementById("localVideo")
            .srcObject = stream;


        videoTrack =
            stream.getVideoTracks()[0];


        audioTrack =
            stream.getAudioTracks()[0];


        if (audioTrack) {

            document
                .getElementById("status")
                .innerText =
                "🎤 Microphone ON";

        }

    }

    catch (error) {

        document
            .getElementById("status")
            .innerText =
            "❌ Camera or microphone permission denied.";

        console.log(error);

    }

}


// ======================================
// MUTE / UNMUTE
// ======================================

function toggleMute() {

    if (!audioTrack) {

        document
            .getElementById("status")
            .innerText =
            "⚠️ Microphone not available";

        return;

    }


    audioTrack.enabled =
        !audioTrack.enabled;


    if (audioTrack.enabled) {

        document
            .getElementById("muteButton")
            .innerText =
            "🎤 Mute";


        document
            .getElementById("status")
            .innerText =
            "🎤 Microphone ON";

    }

    else {

        document
            .getElementById("muteButton")
            .innerText =
            "🔇 Unmute";


        document
            .getElementById("status")
            .innerText =
            "🔇 Microphone MUTED";

    }

}


// ======================================
// CAMERA ON / OFF
// ======================================

function toggleCamera() {

    if (!videoTrack) {

        return;

    }


    videoTrack.enabled =
        !videoTrack.enabled;


    if (videoTrack.enabled) {

        document
            .getElementById("cameraButton")
            .innerText =
            "📹 Camera";


    }

    else {

        document
            .getElementById("cameraButton")
            .innerText =
            "📷 Camera Off";

    }

}


// ======================================
// SWITCH FRONT / BACK CAMERA
// ======================================

async function switchCamera() {

    if (!stream) {

        return;

    }


    try {

        currentCamera =
            currentCamera === "user"
            ? "environment"
            : "user";


        const newVideoStream =
            await navigator.mediaDevices
            .getUserMedia({

                video: {
                    facingMode:
                    currentCamera
                },

                audio: false

            });


        const newVideoTrack =
            newVideoStream
            .getVideoTracks()[0];


        const oldVideoTrack =
            stream
            .getVideoTracks()[0];


        if (oldVideoTrack) {

            oldVideoTrack.stop();

            stream.removeTrack(
                oldVideoTrack
            );

        }


        stream.addTrack(
            newVideoTrack
        );


        videoTrack =
            newVideoTrack;


        document
            .getElementById("localVideo")
            .srcObject =
            stream;


        if (audioTrack &&
            audioTrack.enabled) {

            document
                .getElementById("status")
                .innerText =
                "🎤 Microphone ON";

        }

        else {

            document
                .getElementById("status")
                .innerText =
                "🔇 Microphone MUTED";

        }

    }

    catch (error) {

        document
            .getElementById("status")
            .innerText =
            "❌ Unable to switch camera";

        console.log(error);

    }

}


// ======================================
// START NEXO CALL PAGE
// ======================================

startCall();

</script>

</body>

</html>
