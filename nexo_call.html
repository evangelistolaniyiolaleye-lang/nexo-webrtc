<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Nexo Calling</title>

<style>

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h2 {
    margin: 15px;
}

#localVideo {
    width: 100%;
    height: 60vh;
    background: black;
    object-fit: cover;
}

#status {
    margin: 12px;
}

button {
    padding: 12px;
    margin: 5px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
}

</style>

</head>

<body>

<h2>📞 Nexo Calling</h2>

<video
id="localVideo"
autoplay
playsinline
muted>
</video>

<div id="status">
Starting...
</div>

<button
id="muteButton"
onclick="toggleMute()">
🎤 Mute
</button>

<button
id="cameraButton"
onclick="toggleCamera()">
📹 Camera
</button>

<button
onclick="switchCamera()">
🔄 Switch Camera
</button>


<script>

let stream = null;

let audioTrack = null;

let videoTrack = null;

let cameras = [];

let currentCamera = 0;


// =================================
// START
// =================================

async function startCall() {

    try {

        stream =
        await navigator.mediaDevices.getUserMedia({

            video: true,

            audio: true

        });


        document
        .getElementById("localVideo")
        .srcObject = stream;


        audioTrack =
        stream.getAudioTracks()[0];


        videoTrack =
        stream.getVideoTracks()[0];


        await getCameras();


        document
        .getElementById("status")
        .innerText =
        "🎤 Microphone ON";


    }

    catch (error) {

        document
        .getElementById("status")
        .innerText =
        "❌ Camera/Microphone error";

        console.log(error);

    }

}


// =================================
// FIND CAMERAS
// =================================

async function getCameras() {

    const devices =
    await navigator
    .mediaDevices
    .enumerateDevices();


    cameras =
    devices.filter(function(device) {

        return device.kind ===
        "videoinput";

    });


    console.log("Cameras found:",
    cameras);


    if (cameras.length < 2) {

        document
        .getElementById("status")
        .innerText =
        "⚠️ Only one camera detected";

    }

}


// =================================
// MUTE
// =================================

function toggleMute() {

    if (!audioTrack) {

        return;

    }


    audioTrack.enabled =
    !audioTrack.enabled;


    if (audioTrack.enabled) {

        document
        .getElementById("muteButton")
        .innerText =
        "🎤 Mute";


        document
        .getElementById("status")
        .innerText =
        "🎤 Microphone ON";

    }

    else {

        document
        .getElementById("muteButton")
        .innerText =
        "🔇 Unmute";


        document
        .getElementById("status")
        .innerText =
        "🔇 Microphone MUTED";

    }

}


// =================================
// CAMERA ON/OFF
// =================================

function toggleCamera() {

    if (!videoTrack) {

        return;

    }


    videoTrack.enabled =
    !videoTrack.enabled;


    if (videoTrack.enabled) {

        document
        .getElementById("cameraButton")
        .innerText =
        "📹 Camera";

    }

    else {

        document
        .getElementById("cameraButton")
        .innerText =
        "📷 Camera Off";

    }

}


// =================================
// SWITCH CAMERA
// =================================

async function switchCamera() {

    try {

        await getCameras();


        if (cameras.length < 2) {

            document
            .getElementById("status")
            .innerText =
            "⚠️ Only one camera detected";

            return;

        }


        currentCamera =
        (currentCamera + 1)
        % cameras.length;


        const newStream =
        await navigator
        .mediaDevices
        .getUserMedia({

            video: {

                deviceId: {
                    exact:
                    cameras[currentCamera]
                    .deviceId
                }

            },

            audio: false

        });


        const newVideoTrack =
        newStream
        .getVideoTracks()[0];


        const oldVideoTrack =
        stream
        .getVideoTracks()[0];


        if (oldVideoTrack) {

            oldVideoTrack.stop();

            stream
            .removeTrack(
            oldVideoTrack);

        }


        stream
        .addTrack(
        newVideoTrack);


        videoTrack =
        newVideoTrack;


        document
        .getElementById("localVideo")
        .srcObject =
        stream;


        document
        .getElementById("status")
        .innerText =
        "🔄 Camera switched";


    }

    catch (error) {

        document
        .getElementById("status")
        .innerText =
        "❌ Switch camera failed";


        console.log(error);

    }

}


// START
startCall();

</script>

</body>

</html>
