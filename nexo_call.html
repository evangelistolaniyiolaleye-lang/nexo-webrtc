<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexo Call</title>

<style>

body {
  margin: 0;
  background: #111;
  color: white;
  text-align: center;
  font-family: Arial;
}

video {
  width: 100%;
  max-height: 70vh;
  background: black;
}

button {
  padding: 12px;
  margin: 5px;
  border: none;
  border-radius: 10px;
}

#status {
  margin: 10px;
  font-size: 14px;
}

</style>

</head>

<body>

<h2>📞 Nexo Call</h2>

<video
id="localVideo"
autoplay
playsinline>
</video>

<div id="status">
🎤 Microphone ON
</div>

<div>

  <button onclick="startNexoCall()">
    📞 Call
  </button>

  <button onclick="toggleMute()" id="muteButton">
    🎤 Mute
  </button>

  <button onclick="toggleCamera()">
    📹 Camera
  </button>

  <button onclick="switchCamera()">
    🔄 Switch
  </button>

  <button onclick="endNexoCall()">
    📞 End Call
  </button>

</div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-database-compat.js"></script>


<script>


// ========================================
// FIREBASE
// ========================================

const firebaseConfig = {

  apiKey:
  "AIzaSyAqnRQtBesAGrShPQ89A_abqi6Wejuup8I",

  authDomain:
  "nexoapp-adb97.firebaseapp.com",

  databaseURL:
  "https://nexoapp-adb97-default-rtdb.firebaseio.com",

  projectId:
  "nexoapp-adb97",

  storageBucket:
  "nexoapp-adb97.firebasestorage.app",

  messagingSenderId:
  "694321952953",

  appId:
  "1:694321952953:web:0b62ae562b07dd9f960368"

};


firebase.initializeApp(firebaseConfig);

const database =
firebase.database();


// ========================================
// ORIGINAL VARIABLES
// ========================================

let stream;
let videoTrack;
let audioTrack;
let currentCamera = "user";


// ========================================
// CALL VARIABLES
// ========================================

let callId = null;


// ========================================
// START CAMERA + MICROPHONE
// ========================================

async function startCall() {

  stream =
  await navigator.mediaDevices.getUserMedia({

    video: true,

    audio: true

  });


  document
  .getElementById("localVideo")
  .srcObject = stream;


  videoTrack =
  stream.getVideoTracks()[0];


  audioTrack =
  stream.getAudioTracks()[0];

}


// ========================================
// MUTE / UNMUTE
// ========================================

function toggleMute() {

  if (!audioTrack) return;


  audioTrack.enabled =
  !audioTrack.enabled;


  if (audioTrack.enabled) {

    document
    .getElementById("muteButton")
    .innerText =
    "🎤 Mute";


    document
    .getElementById("status")
    .innerText =
    "🎤 Microphone ON";

  }

  else {

    document
    .getElementById("muteButton")
    .innerText =
    "🔇 Unmute";


    document
    .getElementById("status")
    .innerText =
    "🔇 Microphone MUTED";

  }

}


// ========================================
// CAMERA ON / OFF
// ========================================

function toggleCamera() {

  if (!videoTrack) return;


  videoTrack.enabled =
  !videoTrack.enabled;

}


// ========================================
// ORIGINAL SWITCH CAMERA
// DO NOT CHANGE THIS
// ========================================

async function switchCamera() {

  currentCamera =
    currentCamera === "user"
    ? "environment"
    : "user";


  stream
  .getTracks()
  .forEach(track =>
    track.stop()
  );


  stream =
  await navigator.mediaDevices
  .getUserMedia({

    video: {

      facingMode:
      currentCamera

    },

    audio: true

  });


  document
  .getElementById("localVideo")
  .srcObject =
  stream;


  videoTrack =
  stream.getVideoTracks()[0];


  audioTrack =
  stream.getAudioTracks()[0];

}


// ========================================
// AUTOMATIC NEXO CALL
// ========================================

async function startNexoCall() {

  try {

    if (!stream) {

      await startCall();

    }


    callId =
      "call_" +
      Date.now() +
      "_" +
      Math.random()
      .toString(36)
      .substring(2, 8);


    await database
    .ref("calls/" + callId)
    .set({

      status: "calling",

      createdAt: Date.now()

    });


    document
    .getElementById("status")
    .innerText =
    "📞 Nexo call started";


    console.log(
      "Nexo Call ID:",
      callId
    );

  }

  catch (error) {

    console.log(error);


    document
    .getElementById("status")
    .innerText =
    "❌ Unable to start call";

  }

}


// ========================================
// END NEXO CALL
// ========================================

async function endNexoCall() {

  if (callId) {

    await database
    .ref("calls/" + callId)
    .remove();

    callId = null;

  }


  if (stream) {

    stream
    .getTracks()
    .forEach(track =>
      track.stop()
    );

    stream = null;

  }


  document
  .getElementById("localVideo")
  .srcObject =
  null;


  document
  .getElementById("status")
  .innerText =
  "Call ended";

}


// ========================================
// START
// ========================================

startCall();

</script>

</body>
</html>
