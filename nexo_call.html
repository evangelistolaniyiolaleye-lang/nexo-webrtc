<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexo Calling</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h2 {
        margin: 15px 0;
    }

    #localVideo {
        width: 100%;
        max-height: 65vh;
        background: black;
        object-fit: cover;
    }

    .controls {
        padding: 15px 5px;
    }

    button {
        padding: 12px 14px;
        margin: 5px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
    }

    #status {
        margin: 10px;
        font-size: 14px;
    }
</style>
</head>

<body>

<h2>📞 Nexo Calling</h2>

<video id="localVideo" autoplay playsinline muted></video>

<div id="status">
    Connecting to camera and microphone...
</div>

<div class="controls">

    <button id="muteButton" onclick="toggleMute()">
        🎤 Mute
    </button>

    <button id="cameraButton" onclick="toggleCamera()">
        📹 Camera
    </button>

    <button onclick="switchCamera()">
        🔄 Switch Camera
    </button>

</div>

<script>

let stream = null;
let videoTrack = null;
let audioTrack = null;

let currentCamera = "user";


// START CAMERA AND MICROPHONE
async function startCall() {

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: currentCamera
            },
            audio: true
        });

        document.getElementById("localVideo").srcObject = stream;

        videoTrack = stream.getVideoTracks()[0];
        audioTrack = stream.getAudioTracks()[0];

        document.getElementById("status").innerText =
            "Camera and microphone connected";

    } catch (error) {

        document.getElementById("status").innerText =
            "Camera or microphone permission was denied.";

        console.log(error);
    }
}


// MUTE / UNMUTE MICROPHONE
function toggleMute() {

    if (!audioTrack) {
        return;
    }

    audioTrack.enabled = !audioTrack.enabled;

    const button =
        document.getElementById("muteButton");

    if (audioTrack.enabled) {

        button.innerText = "🎤 Mute";

    } else {

        button.innerText = "🔇 Unmute";
    }
}


// CAMERA ON / OFF
function toggleCamera() {

    if (!videoTrack) {
        return;
    }

    videoTrack.enabled = !videoTrack.enabled;

    const button =
        document.getElementById("cameraButton");

    if (videoTrack.enabled) {

        button.innerText = "📹 Camera";

    } else {

        button.innerText = "📷 Camera Off";
    }
}


// SWITCH FRONT / BACK CAMERA
async function switchCamera() {

    if (!stream) {
        return;
    }

    try {

        currentCamera =
            currentCamera === "user"
            ? "environment"
            : "user";


        const newStream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: currentCamera
                },

                audio: true
            });


        stream.getTracks().forEach(function(track) {
            track.stop();
        });


        stream = newStream;


        document.getElementById("localVideo").srcObject =
            stream;


        videoTrack =
            stream.getVideoTracks()[0];


        audioTrack =
            stream.getAudioTracks()[0];


        document.getElementById("status").innerText =
            "Camera switched";


    } catch (error) {

        document.getElementById("status").innerText =
            "Unable to switch camera.";

        console.log(error);
    }
}


// START
startCall();

</script>

</body>
</html>
