
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexo Call</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px;
  background: #111;
  color: white;
  text-align: center;
  font-family: Arial, sans-serif;
}

h2 { color: #a78bfa; }

video {
  width: 100%;
  max-height: 34vh;
  background: #000;
  border-radius: 12px;
  object-fit: cover;
  margin-bottom: 8px;
}

button {
  padding: 12px;
  margin: 5px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
}

#status {
  margin: 12px;
  font-size: 14px;
  overflow-wrap: anywhere;
}

#remoteVideo { border: 1px solid #a78bfa; }
.hidden { display: none; }
</style>
</head>

<body>
<h2>📞 Nexo Call</h2>

<div id="videoArea">
  <p>You</p>
  <video id="localVideo" autoplay playsinline muted></video>

  <p>Other person</p>
  <video id="remoteVideo" autoplay playsinline></video>
</div>

<div id="status">Checking Supabase authentication…</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

const SUPABASE_URL =
  "https://usdkrqvgfqlxbrzgjrnb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_UCX7yXRcFiDrcmfHAxFejA_6jTtcHwb";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: false,
      autoRefreshToken: false
    }
  }
);

const params = new URLSearchParams(location.search);
const hashParams = new URLSearchParams(location.hash.slice(1));

const roomId = params.get("room");
const role = params.get("role") || "caller";
const callMode = params.get("mode") || "video";
const accessToken = hashParams.get("access_token");

let currentUserId = null;
let stream = null;
let pc = null;
let channel = null;

let currentCamera = "user";
let audioTrack = null;
let videoTrack = null;
let remoteDescriptionSet = false;
let pendingCandidates = [];
let ended = false;
let offerSent = false;
let startInProgress = false;
let endingInProgress = false;

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");
const statusLabel = document.getElementById("status");

function setStatus(message) {
  statusLabel.innerText = message;
}

// Tell Kodular when local call cleanup has completed.
function notifyKodularCallEnded() {
  try {
    if (
      window.Kodular &&
      typeof window.Kodular.setWebViewString === "function"
    ) {
      window.Kodular.setWebViewString("CALL_ENDED");
    }
  } catch (error) {
    console.error("Kodular bridge notification failed:", error);
  }
}

async function authenticateUser() {
  if (!accessToken) {
    throw new Error(
      "Missing Supabase access token. Sign in through NexoApp."
    );
  }

  const { data, error } = await supabase.auth.getUser(accessToken);

  if (error || !data.user) {
    throw new Error(
      "Authentication failed. Sign in to NexoApp again."
    );
  }

  currentUserId = data.user.id;

  await supabase.realtime.setAuth(accessToken);

  history.replaceState(
    null,
    "",
    location.pathname + location.search
  );

  return data.user;
}

async function startMedia() {
  stream = await navigator.mediaDevices.getUserMedia({
    audio: true,
    video: callMode === "audio"
      ? false
      : { facingMode: currentCamera }
  });

  localVideo.srcObject = stream;

  audioTrack = stream.getAudioTracks()[0] || null;
  videoTrack = stream.getVideoTracks()[0] || null;

  document.getElementById("videoArea").classList.toggle(
    "hidden",
    callMode === "audio"
  );

  setStatus(
    callMode === "audio"
      ? "🎤 Microphone ready"
      : "📹 Camera and microphone ready"
  );
}

function sendSignal(data) {
  if (!channel || ended) {
    return Promise.resolve();
  }

  return channel.send({
    type: "broadcast",
    event: "signal",
    payload: {
      ...data,
      senderId: currentUserId
    }
  });
}

function createPeerConnection() {
  if (pc) return;

  pc = new RTCPeerConnection({
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" }
    ]
  });

  stream.getTracks().forEach(track => {
    pc.addTrack(track, stream);
  });

  pc.ontrack = event => {
    if (event.streams && event.streams[0]) {
      remoteVideo.srcObject = event.streams[0];
      remoteVideo.play().catch(() => {});
      setStatus("🟢 Other person connected");
    }
  };

  pc.onicecandidate = event => {
    if (event.candidate) {
      sendSignal({
        kind: "candidate",
        candidate: event.candidate
      });
    }
  };

  pc.onconnectionstatechange = () => {
    if (!pc) return;

    switch (pc.connectionState) {
      case "connected":
        setStatus("🟢 Call connected");
        break;
      case "connecting":
        setStatus("Connecting call…");
        break;
      case "disconnected":
        setStatus("Connection interrupted");
        break;
      case "failed":
        setStatus(
          "Connection failed. A TURN relay may be required."
        );
        break;
      case "closed":
        setStatus("Call ended");
        break;
    }
  };
}

async function createOffer() {
  if (offerSent || !pc || ended) return;

  offerSent = true;

  try {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    await sendSignal({
      kind: "offer",
      description: pc.localDescription
    });

    setStatus("Calling… waiting for answer");
  } catch (error) {
    offerSent = false;
    console.error(error);
    setStatus("Could not start the call.");
  }
}

async function handleSignal(payload) {
  if (!payload || ended || !pc) return;
  if (payload.senderId === currentUserId) return;

  try {
    if (payload.kind === "offer" && role === "receiver") {
      if (pc.remoteDescription) return;

      await pc.setRemoteDescription(payload.description);
      remoteDescriptionSet = true;

      for (const candidate of pendingCandidates) {
        await pc.addIceCandidate(candidate);
      }

      pendingCandidates = [];

      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      await sendSignal({
        kind: "answer",
        description: pc.localDescription
      });

      setStatus("Answer sent… connecting");
    } else if (
      payload.kind === "answer" &&
      role === "caller"
    ) {
      if (pc.remoteDescription) return;

      await pc.setRemoteDescription(payload.description);
      remoteDescriptionSet = true;

      for (const candidate of pendingCandidates) {
        await pc.addIceCandidate(candidate);
      }

      pendingCandidates = [];
    } else if (payload.kind === "candidate") {
      if (remoteDescriptionSet) {
        await pc.addIceCandidate(payload.candidate);
      } else {
        pendingCandidates.push(payload.candidate);
      }
    } else if (payload.kind === "hangup") {
      await endNexoCall(false);
      setStatus("The other person ended the call");
    }
  } catch (error) {
    console.error(error);
    setStatus("Call setup failed. Please try again.");
  }
}

async function startNexoCall() {
  if (startInProgress) return;
  startInProgress = true;

  try {
    if (!roomId) {
      throw new Error("Missing call room ID.");
    }

    if (!["caller", "receiver"].includes(role)) {
      throw new Error("Invalid caller role.");
    }

    if (!["audio", "video"].includes(callMode)) {
      throw new Error("Invalid call mode.");
    }

    await authenticateUser();
    await startMedia();

    createPeerConnection();

    channel = supabase.channel("nexo-call-" + roomId, {
      config: {
        private: true,
        broadcast: { self: false },
        presence: { key: currentUserId }
      }
    });

    channel.on(
      "broadcast",
      { event: "signal" },
      ({ payload }) => {
        handleSignal(payload);
      }
    );

    channel.on("presence", { event: "sync" }, () => {
      const presence = channel.presenceState();
      const members = Object.values(presence).flat();

      const receiverPresent = members.some(
        member =>
          member.role === "receiver" &&
          member.userId !== currentUserId
      );

      if (role === "caller" && receiverPresent) {
        createOffer();
      }
    });

    channel.subscribe(async state => {
      if (state === "SUBSCRIBED") {
        await channel.track({
          userId: currentUserId,
          role: role,
          joinedAt: Date.now()
        });

        setStatus(
          role === "caller"
            ? "Waiting for the receiver…"
            : "Joined room. Waiting for caller…"
        );
      } else if (
        state === "CHANNEL_ERROR" ||
        state === "TIMED_OUT"
      ) {
        setStatus(
          "Realtime access denied or connection failed. Check policies."
        );
      }
    });
  } catch (error) {
    console.error(error);
    setStatus(error.message || "Could not start Nexo Call.");
  } finally {
    startInProgress = false;
  }
}

function toggleMute() {
  if (!audioTrack || ended) return;

  audioTrack.enabled = !audioTrack.enabled;

  document.getElementById("muteButton").innerText =
    audioTrack.enabled ? "🎤 Mute" : "🔇 Unmute";
}

function toggleCamera() {
  if (!videoTrack || ended) return;

  videoTrack.enabled = !videoTrack.enabled;

  document.getElementById("cameraButton").innerText =
    videoTrack.enabled ? "📹 Camera Off" : "📹 Camera On";
}

async function switchCamera() {
  if (!stream || !pc || ended || callMode === "audio") return;

  const previousCamera = currentCamera;

  currentCamera =
    currentCamera === "user" ? "environment" : "user";

  let newTrack = null;

  try {
    const newStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: currentCamera } },
      audio: false
    });

    newTrack = newStream.getVideoTracks()[0];

    const sender = pc.getSenders().find(
      item => item.track && item.track.kind === "video"
    );

    if (sender) await sender.replaceTrack(newTrack);

    const oldTrack = videoTrack;

    if (oldTrack) {
      stream.removeTrack(oldTrack);
      oldTrack.stop();
    }

    stream.addTrack(newTrack);
    videoTrack = newTrack;
    localVideo.srcObject = stream;

    setStatus("📹 Camera switched");
  } catch (error) {
    currentCamera = previousCamera;

    if (newTrack) newTrack.stop();

    console.error(error);
    setStatus("Unable to switch camera");
  }
}

// ========================================
// UPDATED END CALL
// ========================================

async function endNexoCall(notify = true) {
  if (ended || endingInProgress) return;

  endingInProgress = true;

  // Notify the other participant before local cleanup.
  if (notify && channel) {
    try {
      await channel.send({
        type: "broadcast",
        event: "signal",
        payload: {
          kind: "hangup",
          senderId: currentUserId
        }
      });
    } catch (error) {
      console.error("Hang-up signal failed:", error);
    }
  }

  ended = true;

  if (pc) {
    pc.ontrack = null;
    pc.onicecandidate = null;
    pc.onconnectionstatechange = null;
    pc.close();
    pc = null;
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  localVideo.srcObject = null;
  remoteVideo.srcObject = null;

  audioTrack = null;
  videoTrack = null;
  pendingCandidates = [];
  remoteDescriptionSet = false;
  offerSent = false;

  if (channel) {
    const oldChannel = channel;
    channel = null;

    try {
      await supabase.removeChannel(oldChannel);
    } catch (error) {
      console.error("Channel cleanup failed:", error);
    }
  }

  document.getElementById("muteButton").innerText = "🎤 Mute";
  document.getElementById("cameraButton").innerText = "📹 Camera Off";

  setStatus("Call ended");

  // Notify Kodular after cleanup.
  notifyKodularCallEnded();
}

// Start when the page opens.
startNexoCall();
</script>
</body>
</html>
