
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexo Call</title>

<style>
body {
  margin: 0;
  padding: 12px;
  background: #111;
  color: white;
  text-align: center;
  font-family: Arial, sans-serif;
}
h2 { color: #a78bfa; }
video {
  width: 100%;
  max-height: 38vh;
  background: #000;
  border-radius: 12px;
  object-fit: cover;
  margin-bottom: 8px;
}
button {
  padding: 12px;
  margin: 5px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
}
#status { margin: 12px; font-size: 14px; }
.hidden { display: none; }
</style>
</head>

<body>
<h2>📞 Nexo Call</h2>

<div id="videoArea">
  <p>You</p>
  <video id="localVideo" autoplay playsinline muted></video>
  <p>Other person</p>
  <video id="remoteVideo" autoplay playsinline></video>
</div>

<div id="status">Connecting to Nexo Call…</div>

<div>
  <button id="muteButton" onclick="toggleMute()">🎤 Mute</button>
  <button id="cameraButton" onclick="toggleCamera()">📹 Camera Off</button>
  <button onclick="switchCamera()">🔄 Switch</button>
  <button onclick="endNexoCall()">📞 End Call</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const params = new URLSearchParams(location.search);
const roomId = params.get("room");
const role = params.get("role") || "caller";
const callMode = params.get("mode") || "video";

let stream = null;
let pc = null;
let channel = null;
let currentCamera = "user";
let audioTrack = null;
let videoTrack = null;
let remoteDescriptionSet = false;
let pendingCandidates = [];
let ended = false;
let offerSent = false;

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");
const statusLabel = document.getElementById("status");

function setStatus(text) {
  statusLabel.innerText = text;
}

async function startMedia() {
  const constraints = {
    audio: true,
    video: callMode !== "audio"
      ? { facingMode: currentCamera }
      : false
  };

  stream = await navigator.mediaDevices.getUserMedia(constraints);
  localVideo.srcObject = stream;

  audioTrack = stream.getAudioTracks()[0] || null;
  videoTrack = stream.getVideoTracks()[0] || null;

  document.getElementById("videoArea").classList.toggle(
    "hidden", callMode === "audio"
  );

  if (callMode === "audio") {
    setStatus("🎤 Microphone ready — audio call");
  } else {
    setStatus("📹 Camera and microphone ready");
  }
}

function sendSignal(data) {
  if (!channel) return Promise.resolve();

  return channel.send({
    type: "broadcast",
    event: "signal",
    payload: data
  });
}

function createPeerConnection() {
  if (pc) return;

  pc = new RTCPeerConnection({
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" }
    ]
  });

  stream.getTracks().forEach(track => {
    pc.addTrack(track, stream);
  });

  pc.ontrack = event => {
    remoteVideo.srcObject = event.streams[0];
    remoteVideo.play().catch(() => {});
    setStatus("🟢 Connected");
  };

  pc.onicecandidate = event => {
    if (event.candidate) {
      sendSignal({
        kind: "candidate",
        candidate: event.candidate
      });
    }
  };

  pc.onconnectionstatechange = () => {
    if (!pc) return;

    if (pc.connectionState === "connected") {
      setStatus("🟢 Call connected");
    } else if (pc.connectionState === "connecting") {
      setStatus("Connecting call…");
    } else if (pc.connectionState === "disconnected") {
      setStatus("Connection interrupted");
    } else if (pc.connectionState === "failed") {
      setStatus("Connection failed. Check network settings.");
    }
  };
}

async function createOffer() {
  if (offerSent || !pc || ended) return;
  offerSent = true;

  try {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    await sendSignal({
      kind: "offer",
      description: pc.localDescription
    });

    setStatus("Calling… waiting for the other person");
  } catch (error) {
    offerSent = false;
    console.error(error);
    setStatus("Could not start the call");
  }
}

async function handleSignal(payload) {
  if (!payload || ended) return;

  try {
    if (payload.kind === "offer" && role === "receiver") {
      if (pc.remoteDescription) return;

      await pc.setRemoteDescription(payload.description);
      remoteDescriptionSet = true;

      for (const candidate of pendingCandidates) {
        await pc.addIceCandidate(candidate);
      }
      pendingCandidates = [];

      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      await sendSignal({
        kind: "answer",
        description: pc.localDescription
      });

      setStatus("Answer sent — connecting…");
    }

    else if (payload.kind === "answer" && role === "caller") {
      if (!pc || pc.remoteDescription) return;

      await pc.setRemoteDescription(payload.description);
      remoteDescriptionSet = true;

      for (const candidate of pendingCandidates) {
        await pc.addIceCandidate(candidate);
      }
      pendingCandidates = [];
    }

    else if (payload.kind === "candidate" && pc) {
      if (remoteDescriptionSet) {
        await pc.addIceCandidate(payload.candidate);
      } else {
        pendingCandidates.push(payload.candidate);
      }
    }

    else if (payload.kind === "hangup") {
      await endNexoCall(false);
      setStatus("The other person ended the call");
    }
  } catch (error) {
    console.error(error);
    setStatus("Call setup error. Please try again.");
  }
}

async function startNexoCall() {
  if (!roomId) {
    setStatus("Missing call room ID");
    return;
  }

  try {
    ended = false;
    await startMedia();
    createPeerConnection();

    channel = supabase.channel("nexo-call-" + roomId, {
      config: {
        broadcast: { self: false },
        presence: { key: role + "-" + crypto.randomUUID() }
      }
    });

    channel.on("broadcast", { event: "signal" }, ({ payload }) => {
      handleSignal(payload);
    });

    channel.on("presence", { event: "sync" }, () => {
      const presence = channel.presenceState();
      const roles = Object.values(presence).flat().map(item => item.role);

      if (role === "caller" && roles.includes("receiver")) {
        createOffer();
      }
    });

    channel.subscribe(async state => {
      if (state === "SUBSCRIBED") {
        await channel.track({ role, joinedAt: Date.now() });
        setStatus(
          role === "caller"
            ? "Waiting for the other person to join…"
            : "Joined call room — waiting for caller…"
        );
      } else if (state === "CHANNEL_ERROR" || state === "TIMED_OUT") {
        setStatus("Signaling connection failed");
      }
    });
  } catch (error) {
    console.error(error);
    setStatus("Could not access camera/microphone or join call");
  }
}

function toggleMute() {
  if (!audioTrack) return;

  audioTrack.enabled = !audioTrack.enabled;
  document.getElementById("muteButton").innerText =
    audioTrack.enabled ? "🎤 Mute" : "🔇 Unmute";
}

function toggleCamera() {
  if (!videoTrack) return;

  videoTrack.enabled = !videoTrack.enabled;
  document.getElementById("cameraButton").innerText =
    videoTrack.enabled ? "📹 Camera Off" : "📹 Camera On";
}

async function switchCamera() {
  if (!stream || callMode === "audio") return;

  currentCamera = currentCamera === "user" ? "environment" : "user";

  try {
    const newStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentCamera },
      audio: false
    });

    const newTrack = newStream.getVideoTracks()[0];
    const sender = pc?.getSenders().find(s => s.track?.kind === "video");

    if (sender) await sender.replaceTrack(newTrack);

    const oldTrack = videoTrack;
    stream.removeTrack(oldTrack);
    oldTrack?.stop();
    stream.addTrack(newTrack);

    videoTrack = newTrack;
    localVideo.srcObject = stream;
    setStatus("📹 Camera switched");
  } catch (error) {
    console.error(error);
    setStatus("Could not switch camera");
  }
}

async function endNexoCall(notify = true) {
  if (ended) return;
  ended = true;

  if (notify && channel) {
    try {
      await sendSignal({ kind: "hangup" });
    } catch (_) {}
  }

  if (pc) {
    pc.close();
    pc = null;
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  localVideo.srcObject = null;
  remoteVideo.srcObject = null;
  audioTrack = null;
  videoTrack = null;
  remoteDescriptionSet = false;
  pendingCandidates = [];
  offerSent = false;

  if (channel) {
    const oldChannel = channel;
    channel = null;
    await supabase.removeChannel(oldChannel);
  }

  document.getElementById("muteButton").innerText = "🎤 Mute";
  document.getElementById("cameraButton").innerText = "📹 Camera Off";
  setStatus("Call ended");
}

startNexoCall();
</script>
</body>
</html>
